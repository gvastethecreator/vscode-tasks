name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:unit
      - run: pnpm run check-types
      - run: pnpm run compile
      - run: pnpm run test:performance

  extension-host:
    name: Extension Host (${{ matrix.os }}, ${{ matrix.vscode }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            vscode: "1.134.0"
          - os: ubuntu-latest
            vscode: stable
          - os: ubuntu-latest
            vscode: insiders
          - os: windows-latest
            vscode: stable
          - os: macos-latest
            vscode: stable
    env:
      VSCODE_TEST_VERSION: ${{ matrix.vscode }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run package
      - if: runner.os == 'Linux'
        run: xvfb-run -a pnpm run test:integration
      - if: runner.os != 'Linux'
        run: pnpm run test:integration

  vsix:
    name: VSIX package and clean-profile smoke
    runs-on: ubuntu-latest
    needs: [quality]
    env:
      VSCODE_TEST_VERSION: stable
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run vsix
      - run: pnpm run inspect:vsix
      - run: xvfb-run -a pnpm run test:vsix
      - uses: actions/upload-artifact@v6
        with:
          name: status-bar-tasks-vsix
          path: status-bar-tasks.vsix
          if-no-files-found: error
